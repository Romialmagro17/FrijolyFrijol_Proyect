{% extends "base.html" %}
{% block title %}Módulo de Proveedores{% endblock %}
{% block content %}
<h2>Listado de Proveedores</h2>
<div class="row mt-3">
    {% for prov in proveedores %}
    <div class="col-md-6 mb-3">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ prov.empresa }}</h5>
                <p class="card-text">Contacto: {{ prov.contacto }}</p>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
