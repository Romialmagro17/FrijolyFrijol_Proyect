{% extends "base.html" %}
{% block title %}Módulo de Productos{% endblock %}
{% block content %}
<h2>Listado de Productos</h2>
<table class="table table-striped mt-3">
    <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Stock</th>
        </tr>
    </thead>
    <tbody>
        {% for p in productos %}
        <tr>
            <td>{{ p.id }}</td>
            <td>{{ p.nombre }}</td>
            <td>${{ p.precio }}</td>
            <td>{{ p.stock }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
