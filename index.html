<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frijol y Frijol - Planificador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR MEJORADA -->
    <nav class="navbar navbar-expand-lg custom-navbar mb-4">
        <div class="container">
            <a class="navbar-brand brand-text fw-bold" href="#">Frijol y Frijol</a>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row">
            <div class="col-md-7">
                <!-- FORMULARIO -->
                <div class="card p-4 mb-4 form-container shadow-sm">
                    <h3 class="h4 text-dark-brown">Registro de Ideas</h3>
                    <form id="formulario-registro" class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Título del Juguete o Lugar</label>
                            <input type="text" class="form-control" id="nombre" required minlength="3">
                        </div>
                        <div class="mb-3">
                            <label for="categoria" class="form-label">Categoría</label>
                            <select class="form-select" id="categoria" required>
                                <option value="">Seleccione...</option>
                                <option value="Trabajo">Trabajo</option>
                                <option value="Personal">Personal</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary custom-btn">Registrar</button>
                    </form>
                </div>

                <!-- ALERTA DE ÉXITO -->
                <div id="alerta-contenedor"></div>

                <!-- SPINNER -->
                <div id="spinner-carga" class="d-none text-center my-3">
                    <div class="spinner-border text-success" role="status"></div>
                </div>

                <h3 class="h4 text-dark-brown">Ideas Registradas</h3>
                <span class="badge bg-secondary mb-3">Total: <span id="contador-reg">0</span></span>
                
                <div id="contenedor-lista" class="row row-cols-1 g-3"></div>
            </div>
        </div>
    </div>

    <!-- BOTÓN PARA ABRIR MODAL -->
    <div class="container mb-5">
        <button type="button" class="btn btn-info text-white" data-bs-toggle="modal" data-bs-target="#infoModal">
            Ver Instrucciones
        </button>
    </div>

    <!-- MODAL -->
    <div class="modal fade" id="infoModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Proyecto Integrador</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">Bienvenida al sistema de gestión de ideas de Frijol y Frijol.</div>
            </div>
        </div>
    </div>

    <footer class="footer-bg text-center mt-5 p-4 text-white">
        <p>&copy; 2026 Proyecto Integrador</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
