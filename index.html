<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frijol y Frijol - Planificador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- BLOQUE: ENCABEZADO (BASE.HTML) -->
    <header class="bg-dark text-white p-3 text-center">
        <h1>Frijol y Frijol</h1>
    </header>

    <div class="container my-5">
        <div class="row">
            <!-- BLOQUE: CONTENIDO PRINCIPAL -->
            <div class="col-md-7">
                <div class="card shadow-sm p-4 mb-4">
                    <h3 class="h4 mb-3">Registro de Ideas</h3>
                    <form id="formulario-registro" class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Título del Juguete o Lugar</label>
                            <input type="text" class="form-control" id="nombre" required minlength="3">
                            <div class="invalid-feedback">El título debe tener al menos 3 caracteres.</div>
                        </div>
                        <div class="mb-3">
                            <label for="categoria" class="form-label">Categoría</label>
                            <select class="form-select" id="categoria" required>
                                <option value="">Seleccione...</option>
                                <option value="Trabajo">Trabajo</option>
                                <option value="Personal">Personal</option>
                            </select>
                            <div class="invalid-feedback">Debe seleccionar una categoría.</div>
                        </div>
                        <button type="submit" class="btn btn-primary">Registrar</button>
                    </form>
                </div>

                <h3 class="h4">Ideas Registradas</h3>
                <span class="badge bg-dark rounded-pill px-3 py-2 mb-3">Total: <span id="contador-reg">0</span></span>
                
                <!-- BLOQUE: CONTENIDO DINÁMICO (RENDERIZADO POR JS) -->
                <div id="contenedor-lista" class="row row-cols-1 g-3"></div>
            </div>
        </div>
    </div>

    <!-- BLOQUE: PIE DE PÁGINA -->
    <footer class="text-center mt-5 p-3">
        <p>&copy; 2026 Proyecto Integrador</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
