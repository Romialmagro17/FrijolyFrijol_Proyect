<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frijol y Frijol - Planificador</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <div class="container my-5">
        <div class="row">
            <div class="col-md-5 mb-4">
                <div class="card shadow-sm p-4 border-0 bg-white">
                    <h3 class="h4 mb-3 text-dark fw-bold">Planificador de Contenido</h3>
                    
                    <form id="formulario-registro">
                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-semibold">Nombre del Juguete o Lugar</label>
                            <input type="text" class="form-control" id="nombre" placeholder="Ej. Bloques LEGO o Parque Infantil">
                        </div>
                        <div class="mb-3">
                            <label for="categoria" class="form-label fw-semibold">Tipo de Video / Categoría</label>
                            <select class="form-select" id="categoria">
                                <option value="">Selecciona una opción...</option>
                                <option value="Unboxing">Unboxing de Juguetes</option>
                                <option value="Punto de Interés">Punto de Interés / Paseo</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="descripcion" class="form-label fw-semibold">¿De qué tratará el video?</label>
                            <textarea class="form-control" id="descripcion" rows="3" placeholder="Escribe los detalles o ideas principales..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-warning w-100 text-white fw-bold shadow-sm">Agregar Idea</button>
                    </form>
                    
                    <div id="mensaje-validacion" class="mt-3"></div>
                </div>
            </div>

            <div class="col-md-7">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3 class="h4 text-dark fw-bold">Ideas Registradas</h3>
                    <span class="badge bg-dark fs-6 rounded-pill px-3 py-2">Total: <span id="contador-registros">0</span></span>
                </div>
                <div id="contenedor-lista" class="row row-cols-1 g-3"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script src="script.js"></script>
</body>
</html>
